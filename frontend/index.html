<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Tracker</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.3/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container app-shell">
        <div class="row">
            <div class="col-md-8 col-md-offset-2">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">New Application</h3>
                    </div>
                    <div class="panel-body">
                        <form id="application">
                            <div class="form-group">
                                <label for="company">Company</label>
                                <input class="form-control" id="company" name="company" required>
                            </div>

                            <div class="form-group">
                                <label for="source">Where did you find this internship?</label>
                                <input class="form-control" id="source" name="source" required>
                            </div>

                            <div class="form-group">
                                <label for="season">What season is the internship?</label>
                                <select class="form-control" id="season" name="season" required>
                                    <option selected disabled value="">Select a season</option>
                                    <option value="Fall">Fall</option>
                                    <option value="Spring">Spring</option>
                                    <option value="Summer">Summer</option>
                                    <option value="FullYear">Full Academic Year</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="date">Date Applied</label>
                                <input type="date" id="date" name="date" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block">Submit</button>
                        </form>
                    </div>
                </div>

                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">Applications</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Company</th>
                                    <th>Source</th>
                                    <th>Season</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="applications"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/scripts.js"></script>
</body>

</html>
